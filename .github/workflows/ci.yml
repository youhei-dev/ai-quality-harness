# Self CI of this repository (ADR-0025, docs/ops/ci-and-branch-protection.md).
# Read-only token, actions pinned to full commit SHAs, no secrets, no cache, no uploaded artifacts.
# "verify (ubuntu)" is not a required check yet; "measure (windows)" runs only on manual runs and never fails the run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The local npm protection settings (the user's ~/.npmrc), as far as the runner's npm reads them: npm 11.8.0,
  # bundled with Node 24.13.1, reads ignore-scripts but does not know min-release-age or allow-git (ADR-0025).
  npm_config_ignore_scripts: "true"

concurrency:
  # A pull request cancels its own older runs; a push to main or a manual run gets its own group and is never cancelled.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-ubuntu:
    # The name is what a required check will refer to; do not rename it.
    name: verify (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify

  measure-windows:
    # Measurement only (Windows is not a supported platform): a failure here does not fail the run.
    # Manual runs only, to save minutes (Windows minutes count double on a private repository).
    name: measure (windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
