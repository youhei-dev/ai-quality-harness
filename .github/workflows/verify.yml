# Reusable workflow: run `aiqh verify` on the caller's repository (ADR-0031, docs/ops/reusable-workflow.md).
# Call it pinned to a full 40-character commit SHA of this repository, with the version in a trailing comment.
# aiqh is not a package here: the workflow checks out its own commit (job.workflow_repository / job.workflow_sha),
# installs only aiqh's runtime dependencies from its lockfile, and puts a small `aiqh` launcher on PATH.
# Read-only token, actions pinned to full commit SHAs, no secrets, no cache, no uploaded artifacts.
# The report stays in the job unless job-summary is true (then latest.md, already masked, goes to the job summary).
name: aiqh verify (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for aiqh and the target (24 or later)
        type: string
        default: "24.13.1"
      python-version:
        description: Python version to set up; empty sets up no Python
        type: string
        default: ""
      setup-command:
        description: Command run in the working directory before verify (for example npm ci); empty runs nothing
        type: string
        default: ""
      working-directory:
        description: Directory inside the caller's repository where aiqh verify runs (relative, without "..")
        type: string
        default: "."
      config:
        description: Path of the aiqh config, relative to the working directory
        type: string
        default: aiqh.config.jsonc
      job-summary:
        description: Append the latest.md of this run to the job summary (verify then writes its report into a new directory under RUNNER_TEMP instead of the working directory)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: aiqh verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The caller's workflow-level env does not reach a called workflow, so the npm protection is set here (ADR-0025).
      npm_config_ignore_scripts: "true"
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - name: Check that the working directory stays inside the caller's repository
        id: guard
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          case "/$WORKING_DIRECTORY/" in
            *"/../"*) echo "::error::working-directory must not contain '..'"; exit 1 ;;
          esac
          case "$WORKING_DIRECTORY" in
            /*) echo "::error::working-directory must be a relative path"; exit 1 ;;
          esac
          root="$(realpath -e target)"
          dir="$(realpath -e "target/$WORKING_DIRECTORY")"
          case "$dir/" in
            "$root/"*) ;;
            *) echo "::error::working-directory resolves outside the caller's repository"; exit 1 ;;
          esac
      - name: Check out aiqh at the commit of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aiqh-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Check the Node.js version
        run: |
          set -euo pipefail
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 24 ]; then
            echo "::error::aiqh needs Node.js 24 or later (node-version gave $(node --version))"
            exit 1
          fi
      - if: inputs.python-version != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install aiqh (its runtime dependencies only, from its own lockfile)
        working-directory: aiqh-src
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ -z "$WORKFLOW_SHA" ] || [ "$head" != "$WORKFLOW_SHA" ]; then
            echo "::error::the aiqh checkout is not the commit of this workflow (job.workflow_sha)"
            exit 1
          fi
          echo "aiqh source: $head (matches job.workflow_sha)"
          npm ci --omit=dev --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/aiqh-bin"
          printf '#!/bin/sh\nexec node "%s/src/cli.ts" "$@"\n' "$PWD" > "$RUNNER_TEMP/aiqh-bin/aiqh"
          chmod +x "$RUNNER_TEMP/aiqh-bin/aiqh"
          echo "$RUNNER_TEMP/aiqh-bin" >> "$GITHUB_PATH"
      - name: Set up the caller's repository
        if: inputs.setup-command != ''
        working-directory: target/${{ inputs.working-directory }}
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"
      # job-summary (v0.15.1, ROADMAP item 51): verify writes its report into a new empty directory of this run, named in the step
      # output report-dir before verify starts, so the summary step finds this run's latest.md wherever the config and output.dir
      # are, and never an older one. Without job-summary, verify is called as before.
      - name: aiqh verify
        id: verify
        working-directory: target/${{ inputs.working-directory }}
        env:
          AIQH_CONFIG: ${{ inputs.config }}
          JOB_SUMMARY: ${{ inputs.job-summary }}
        run: |
          aiqh --version
          if [ "$JOB_SUMMARY" = "true" ]; then
            dir="$(mktemp -d "$RUNNER_TEMP/aiqh-verification.XXXXXX")"
            echo "report-dir=$dir" >> "$GITHUB_OUTPUT"
            aiqh verify --config "$AIQH_CONFIG" --output-dir "$dir"
          else
            aiqh verify --config "$AIQH_CONFIG"
          fi
      - name: Append latest.md to the job summary
        if: always() && inputs.job-summary && steps.guard.outcome == 'success'
        working-directory: target/${{ inputs.working-directory }}
        env:
          REPORT_DIR: ${{ steps.verify.outputs.report-dir }}
        run: |
          if [ -n "$REPORT_DIR" ] && [ -f "$REPORT_DIR/latest.md" ]; then
            cat "$REPORT_DIR/latest.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "aiqh: latest.md was not written (see the log of the aiqh verify step)" >> "$GITHUB_STEP_SUMMARY"
          fi
